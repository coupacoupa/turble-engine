syntax = "proto3";

package turble.engine.v1;

import "turble/engine/v1/matrix.proto";

message ExecuteMatrixRequest {
  string matrix_id = 1;
  MatrixSchema matrix_schema = 2;
  string initial_payload_json = 3;
}

message CellResultProto {
  string cell_id = 1;
  string row_id = 2;
  string col_id = 3;
  CellActionType action = 4;
  string status = 5;
  string mutated_payload_json = 6;
  int64 latency_ms = 7;
}

message StepEvaluationRecordProto {
  int32 step_index = 1;
  string col_id = 2;
  string col_label = 3;
  int64 timestamp = 4;
  string initial_payload_json = 5;
  string final_payload_json = 6;
  repeated CellResultProto cell_results = 7;
}

message ExecuteMatrixResponse {
  string execution_id = 1;
  string matrix_id = 2;
  string final_payload_json = 3;
  bool has_errors = 4;
  repeated StepEvaluationRecordProto step_records = 5;
}

message StreamExecutionStepsRequest {
  string matrix_id = 1;
  string initial_payload_json = 2;
}

message ExecutionEventProto {
  int64 seq = 1;
  string type = 2;
  string span_id = 3;
  string parent_span_id = 4;
  int64 t_monotonic_us = 5;
  string payload_json = 6;
}

message StreamExecutionStepsResponse {
  string execution_id = 1;
  StepEvaluationRecordProto current_step_record = 2;
  bool is_completed = 3;
  repeated ExecutionEventProto events = 4;
}

service MatrixEvaluatorService {
  // Execute matrix workflow unary call
  rpc ExecuteMatrix(ExecuteMatrixRequest) returns (ExecuteMatrixResponse);
  
  // Real-time server streaming step telemetry
  rpc StreamExecutionSteps(StreamExecutionStepsRequest) returns (stream StreamExecutionStepsResponse);
}
